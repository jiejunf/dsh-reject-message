<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="拒绝审批时进入同款描述窗，审查理由已预填；确认后描述随工具错误结果进入模型上下文">
  <title>拒绝并附言</title>
  <style>
    :root {
      --bg: #f5f6fc;
      --ink: #1f2a44;
      --muted: #7a859e;
      --accent: #4d6bfe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0e13;
        --ink: #f9fafb;
        --muted: #8a9099;
        --accent: #60a5fa;
      }
    }
  </style>

  <rect width="640" height="300" fill="var(--bg)"/>
  <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="32" y="54" font-family="'Songti SC', 'SimSun', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="700" fill="var(--ink)">拒绝审批时，把原因一并交给模型</text>
    <text x="32" y="79" font-size="11.5" fill="var(--muted)">点「拒绝」进入描述窗，审查理由已预填，确认后随工具结果进入模型。</text>

    <!-- native approval card -->
    <rect x="32" y="104" width="244" height="156" rx="9" fill="#2c2c2e" stroke="#f7ad31"/>
    <path d="M32 113 A9 9 0 0 1 41 104 H267 A9 9 0 0 1 276 113 V128 H32 Z" fill="#27241f"/>
    <circle cx="47" cy="117" r="3" fill="#f7ad31"/>
    <text x="56" y="120.5" font-size="8.5" fill="#f7ad31">等待审批</text>

    <text x="48" y="146" font-size="8.5" fill="#f0f1f3"><tspan font-weight="600">Auto review 拒绝了此调用：</tspan> 未授权删除</text>
    <text x="48" y="160" font-size="7.5" fill="#e3e4e4">Temporary-directory deletion is irreversible removal</text>
    <text x="48" y="172" font-size="7.5" fill="#e3e4e4">of an object not shown to have been created here.</text>

    <text x="48" y="188" font-family="'Cascadia Mono', Consolas, monospace" font-size="6.5" fill="#adb2b8">if (Test-Path -LiteralPath (Join-Path $env:TEMP 'dsh-</text>
    <text x="48" y="198" font-family="'Cascadia Mono', Consolas, monospace" font-size="6.5" fill="#adb2b8">approval-manual-test')) {</text>
    <text x="56" y="208" font-family="'Cascadia Mono', Consolas, monospace" font-size="6.5" fill="#adb2b8">Remove-Item ... -Recurse -Force</text>
    <text x="48" y="218" font-family="'Cascadia Mono', Consolas, monospace" font-size="6.5" fill="#adb2b8">} else { 'absent' }</text>

    <rect x="170" y="226" width="40" height="22" rx="6" fill="none" stroke="#5a5a5c"/>
    <text x="190" y="241" font-size="8.5" fill="#e3e4e4" text-anchor="middle">拒绝</text>
    <rect x="218" y="226" width="46" height="22" rx="6" fill="#f9fafb"/>
    <text x="241" y="241" font-size="8" font-weight="500" fill="#151517" text-anchor="middle">允许一次</text>

    <!-- arrow -->
    <text x="299" y="172" font-size="9" font-weight="600" fill="var(--accent)" text-anchor="middle">点「拒绝」</text>
    <path d="M286 184 H312" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M306 179 L312 184 L306 189" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- reject dialog -->
    <rect x="322" y="104" width="286" height="156" rx="9" fill="#2c2c2e" stroke="#f25a5a"/>
    <path d="M322 113 A9 9 0 0 1 331 104 H599 A9 9 0 0 1 608 113 V128 H322 Z" fill="#27241f"/>
    <circle cx="337" cy="117" r="3" fill="#f25a5a"/>
    <text x="346" y="120.5" font-size="8.5" fill="#f25a5a">拒绝此次提权</text>

    <text x="338" y="146" font-size="8.5" fill="#adb2b8">可填写拒绝原因，模型会看到这段描述。</text>
    <text x="338" y="159" font-size="7.5" fill="#7d8084">已自动填入审查理由，可修改或清空。</text>
    <rect x="332" y="166" width="266" height="52" rx="7" fill="#353638" stroke="#4a4b4e"/>
    <text x="342" y="181" font-size="7.5" fill="#e3e4e4">Temporary-directory deletion is irreversible removal</text>
    <text x="342" y="193" font-size="7.5" fill="#e3e4e4">of an object not shown to have been created here, and</text>
    <text x="342" y="205" font-size="7.5" fill="#e3e4e4">the scope of this deletion is not authorized.</text>

    <rect x="468" y="226" width="48" height="22" rx="6" fill="none" stroke="#5a5a5c"/>
    <text x="492" y="241" font-size="8.5" fill="#e3e4e4" text-anchor="middle">返回</text>
    <rect x="524" y="226" width="68" height="22" rx="6" fill="none" stroke="#5a5a5c"/>
    <text x="558" y="241" font-size="8.5" fill="#f25a5a" text-anchor="middle">确认拒绝</text>

  </g>
</svg>
